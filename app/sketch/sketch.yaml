# Versioni recuperate dalla App gia funzionante sull'UNO Q del team.
# Bridge esplicito: il profilo puo essere compilato anche con arduino-cli.
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_RouterBridge (0.4.3)
      - dependency: ArduinoGraphics (1.1.5)
      - dependency: Arduino_HS300x (1.0.1)
      - dependency: Arduino_LPS22HB (1.0.3)
      - dependency: Arduino_LSM6DSOX (1.1.2)
      - dependency: Arduino_LTR381RGB (1.0.1)
      - Arduino_Modulino (0.9.0)
      - dependency: STM32duino VL53L4CD (1.0.5)
      - dependency: STM32duino VL53L4ED (1.0.1)
default_profile: default
